name: Build Windows EXE

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.6

      - name: Set up Node.js 24 (LTS)
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Verify release versions
        run: node scripts/verify-release-version.mjs

      - name: Verify release tag matches application version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: node scripts/verify-release-version.mjs $env:GITHUB_REF_NAME

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm check

      - name: Build NSIS installer and portable executable
        run: pnpm dist:win

      - name: Verify update release artifacts
        run: pnpm verify:updates

      - name: Run packaged Electron smoke test
        run: pnpm verify:package

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: |
            release/*.exe
            release/latest.yml
            release/*.blockmap
          if-no-files-found: error
          compression-level: 0

      - name: Create GitHub release (tags only)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ApeRadar Next ${{ github.ref_name }}
          body_path: docs/releases/${{ github.ref_name }}.md
          files: |
            release/*.exe
            release/latest.yml
            release/*.blockmap
          fail_on_unmatched_files: true
